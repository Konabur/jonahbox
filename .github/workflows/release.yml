name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      - name: collect binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/jonahbox.exe "dist/jonahbox-windows-${{ runner.arch }}.exe"
          else
            cp target/release/jonahbox "dist/jonahbox-${{ runner.os }}-${{ runner.arch }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jonahbox-${{ matrix.os }}
          path: dist/

  linux-glibc:
    name: build-linux-glibc
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      - name: collect binary
        run: |
          mkdir -p dist
          cp target/release/jonahbox dist/jonahbox-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: jonahbox-linux-glibc
          path: dist/

  musl:
    name: build-linux-musl
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: collect binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/jonahbox dist/jonahbox-linux-musl-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: jonahbox-linux-musl
          path: dist/

  release:
    name: publish
    needs: [build, linux-glibc, musl]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
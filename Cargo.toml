[package]
name = "jonahbox"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
async-compression = { version = "0.4.10", features = ["brotli", "tokio"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures-util = "0.3.30"
rand = { version = "0.8.5", default-features = false, features = ["std", "getrandom"] }
reqwest = { version = "0.12.4", default-features = false, features = ["json", "brotli", "rustls-tls"] }
serde = { version = "1.0.202", features = ["derive"] }
serde_json = "1.0.117"
serde_urlencoded = "0.7.1"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "macros", "fs", "process", "signal"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7.11", features = ["io"] }
tower-http = { version = "0.6.10", features = ["trace", "fs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.8.0", features = ["serde"] }
fd-lock = "4.0.2"
toml = "0.8.13"
dashmap = { version = "5.5.3", features = ["serde"] }
nanoid = "0.4.0"
tiny-skia = "0.11.4"
csscolorparser = { version = "0.6.2", features = ["serde"] }
rand_xoshiro = "0.6.0"
phf = "0.11.2"
glob = "0.3.1"
ansi-to-html = { version = "0.2.1", features = ["lazy-init"] }
color-eyre = "0.6.3"
tracing-error = "0.2.0"
ratatui = { version = "0.26.3", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.27.0", features = ["event-stream"] }
boxcar = "0.2.5"
qrcode = { version = "0.14.0", default-features = false }
indexmap = { version = "2.2.6", features = ["serde"] }
ringbuf = "0.4.1"
yrs = { version = "0.26.0", features = ["sync"] }
base64 = "0.22.1"
regex = "1.12.3"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
